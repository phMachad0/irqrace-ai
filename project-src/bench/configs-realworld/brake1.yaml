schema_version: c1/2.0.0
subject:
  name: brake1
  source_root: ../realworld
  sources:
  - brake1/main.c
  build:
    mode: single-tu
    cc: clang-14
    linker: llvm-link-14
    flags:
    - -g
    - -O0
    - -Xclang
    - -disable-O0-optnone
    defines: []
priority_convention: larger-is-higher
flows:
- id: main
  kind: task
  entry: main
  irq: null
  priority: 0
  identified_by: config
- id: task_RR_Wheel
  kind: isr
  entry: task_RR_Wheel_isr
  irq: 1
  priority: 5
  identified_by: config
- id: task_compute
  kind: isr
  entry: task_compute_isr
  irq: 2
  priority: 6
  identified_by: config
masking:
  primitives:
  - function: disable_isr
    effect: disable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
  - function: enable_isr
    effect: enable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
  initial_state: unknown
  isr_entry_masks_self: false
semantics:
  equal_priority_preemption: true
  isr_arrival: unbounded
  isr_reentrant: false
  nesting: true
  timing_model: unconstrained
externals:
  default: may-read-write-reachable
  models: []
ground_truth:
  kind: violation-info
  path: brake1/violation.info
