schema_version: c1/2.0.0
subject:
  name: blink2
  source_root: ../realworld
  sources:
  - blink2/main.c
  build:
    mode: single-tu
    cc: clang-14
    linker: llvm-link-14
    flags:
    - -g
    - -O0
    - -Xclang
    - -disable-O0-optnone
    defines: []
priority_convention: larger-is-higher
flows:
- id: main
  kind: task
  entry: main
  irq: null
  priority: 0
  identified_by: config
- id: Timer_A
  kind: isr
  entry: Timer_A_isr
  irq: 1
  priority: 3
  identified_by: config
- id: Timer_B
  kind: isr
  entry: Timer_B_isr
  irq: 2
  priority: 2
  identified_by: config
- id: Timer_C
  kind: isr
  entry: Timer_C_isr
  irq: 3
  priority: 4
  identified_by: config
- id: Timer_Force
  kind: isr
  entry: Timer_Force_isr
  irq: 4
  priority: 3
  identified_by: config
masking:
  primitives:
  - function: disable_isr
    effect: disable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
  - function: enable_isr
    effect: enable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
  initial_state: unknown
  isr_entry_masks_self: false
semantics:
  equal_priority_preemption: true
  isr_arrival: unbounded
  isr_reentrant: false
  nesting: true
  timing_model: unconstrained
externals:
  default: may-read-write-reachable
  models: []
ground_truth:
  kind: violation-info
  path: blink2/violation.info
