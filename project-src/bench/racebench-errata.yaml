# Curated errata for the Racebench 2.1_remarks ground-truth annotations.
#
# Policy decision, 2026-09-10: the evaluation harness matches reported candidates
# against the *corrected* annotations, and every correction lives here, with the
# evidence for it, so that the deviation from the shipped suite is auditable
# rather than silent. See docs/evaluation-protocol.md.
#
# Nothing in `corrections` changes the COUNTS: only line numbers and access kinds
# are corrected. The counts changed once, on 2026-10-28, by a different route:
# five trap labels the suite's own README contradicts were relabelled as bug
# points IN THE SUITE'S SOURCE (see `relabel_2026_10_28` below). Since then the
# 31 simple cases carry 53 bug points and 33 traps; before, 48 and 38. Every
# number in this project dated before 2026-10-28 uses 48/38.
#
# Confidence levels:
#   certain   -- the source admits only one reading
#   likely    -- the correction is strongly implied but rests on a reconstruction
#
# Each entry names an annotation by (case, kind, index) exactly as numbered in
# the file, quotes it as written, and gives the corrected access triple in
# annotation order A1, B, A2.

schema_version: errata/1.0.0
suite: racebench 2.1_remarks
curated: 2026-09-10
curated_by: hand verification against the case sources; see docs/groundtruth-handcount.md

notes:
  relabel_2026_10_28: >
    Five planted false positives were relabelled as bug points, by editing the
    annotation comments in ../racebench/2.1_remarks (the suite's git diff shows
    it; the repository was not committed to). Each is reachable under the suite's
    own README -- "an interrupt may preempt the main program or a lower-level
    interrupt whenever it is enabled, at an indeterminate moment, position and
    number of times" -- and each was hand-checked as a concrete interleaving
    (wiki: Racebench Full Run 2026-10-28, "Verdict on every disputed item";
    Contradictions #7 and #8).
      svp_simple_001_001 trap 1 -> bug 2, global_var <W#43><R#64><W#44>: isr_1 may
        fire between init() and disable_isr(2), or start a second time with irq 2
        already unmasked by its first run.
      svp_simple_019_001 traps 2, 3, 4 -> bugs 2, 3, 4 (lines corrected too):
        trap 2 was valid for the 2.1 copy but not for 2.1_remarks, where
        enable_isr(1) moved before the read; traps 3 and 4 are reachable in both
        copies through the unmasked gap between two critical sections.
      svp_simple_020_001 trap 1 -> bug 3, global_var <R#37><W#44><R#40>: reachable
        with two isr_1 activations.
    Remaining labels are shipped as is, including svp_simple_022_001's two
    "可能误报" (possible false positive) items, which are reachable but
    effect-free and hedged by the annotator themself. Counts: 48 -> 53 bug
    points, 38 -> 33 traps. The competition rules (NASAC2019ProtoCompFinal.md)
    quote 50 and 33 for the 2.1 suite; that 33 matches is a coincidence of
    different corrections, not a reconciliation.
  svp_simple_006_001: >
    Source patched in the local checkout, 2026-10-22, not an annotation
    correction: line 30 read `for (int j = 0; i < 5; j++)`, whose condition never
    changes, so the inner loop never exits with i == 0 and the annotated bug
    point's A2 (line 35, guarded by i == 4) is dead code. A sound solver refutes
    it. Patched to `j < 5`, the evident intent, in 2.1_remarks/ and 2.1/
    (racebench `git diff` shows it); results on an unpatched checkout give 47/48.
  svp_simple_019_001: >
    Every annotation in this case is offset, and the offsets are reconstructible
    rather than arbitrary. In the main task the accesses to global_var1 sit at
    lines 45, 51 and 59 while the annotations name 45, 49 and 54; the accesses to
    global_condition3 sit at 48 and 56 while the annotations name 48 and 53. Every
    write in isr_1 is understated by exactly six lines: global_var2 is written at
    67 and annotated 61, global_condition3 at 69 annotated 63, global_var1 at 71
    annotated 65.

    Six lines explain all of it. The two guarded blocks in main are

        if ((cond1 == 1) && (condition3 == 1))
        {                      <- inserted
          enable_isr(1);       <- inserted
          reader4 = global_var1;
        }                      <- inserted

    and the same three lines again around reader5. Adding those six lines shifts
    every later line by exactly the number of insertions above it: reader4 by 2
    (49 -> 51), the blank before the second idlerun by 3 (53 -> 56), reader5 by 5
    (54 -> 59), and everything in isr_1 by all 6 (65 -> 71). The annotations were
    therefore written against the file before those blocks were expanded.

    One consequence is NOT corrected here, because it is not a line-number
    question: `enable_isr(1)` inside those blocks is semantically significant --
    it is what makes the reads at 51 and 59 preemptible despite the `disable_isr(1)`
    at 47 and 55. If the annotations predate that edit, the bug/trap *labels* for
    this case may be stale too, not only the line numbers. Recorded as an open
    question rather than resolved by decree; the labels are left as shipped.

  shape_effects: >
    Correcting access kinds moves six annotations between shape buckets. Two of
    them, svp_simple_002_001 trap 3 and svp_simple_017_001 trap 1, become (W,W,W),
    a shape outside the four-pattern set the suite is usually described by. That
    is coherent rather than alarming: an ISR write between two task writes to one
    location is not an atomicity violation under last-writer-wins, which is a
    plausible thing to plant as a false positive. Both are traps, neither is a bug
    point, and the recall denominator is unaffected.

corrections:

  # -- line numbers ------------------------------------------------------
  #
  # The six line corrections that lived here (svp_simple_001_001 trap 1;
  # svp_simple_019_001 bug 1 and traps 1-4) were removed on 2026-10-28, when
  # the annotations themselves were corrected in the suite's source, lines
  # included -- see `relabel_2026_10_28` in the notes above. Their evidence is in
  # git history (this file, before that date) and in wiki/benchmarks/Racebench.md.

  # -- access kinds ------------------------------------------------------

  - case: svp_simple_002_001
    kind: trap
    index: 3
    reason: access-kind
    confidence: certain
    as_written: "svp_simple_002_001_global_array<R#33>,<W#44>,<R#35>"
    corrected: [[write, 33], [write, 44], [write, 35]]
    evidence: >
      Line 33 is `if (i == TRIGGER) global_array[TRIGGER] = 1;` and line 35 is
      `global_array[TRIGGER] = 1;` -- both writes. The same file's bug point 1 and
      trap 1 already annotate those very lines as `<W#33>` and `<W#35>`, so the
      annotator's own other entries contradict this one.

  - case: svp_simple_016_001
    kind: bug
    index: 1
    reason: access-kind
    confidence: certain
    as_written: "svp_simple_016_001_global_var1<W#24>,<R#33>,<R#25>"
    corrected: [[write, 24], [write, 33], [read, 25]]
    evidence: >
      Line 33 is `svp_simple_016_001_global_var1 = 0x09;`, the only access in
      isr_1 and unambiguously a write. The same file's bug points 2 and 3
      annotate that very line as `<W#33>`, so the annotator's own entries
      contradict this one.

      There is a second, independent reason to believe the correction. In
      every other annotated triple in the suite, B conflicts with both ends:
      each of (A1, B) and (B, A2) involves a write. Read literally, this entry
      is (W,R,R), whose (B, A2) is (R,R): two reads, which cannot conflict, so
      no atomicity violation can arise from it. It is the only annotation in
      the suite with that property, and the correction removes it.

  - case: svp_simple_017_001
    kind: trap
    index: 1
    reason: access-kind
    confidence: likely
    as_written: "svp_simple_017_001_local_array<R#32>,<W#41>,<R#32>"
    corrected: [[write, 32], [write, 41], [write, 32]]
    evidence: >
      The annotated variable is local_array, and line 32 is
      `local_array[global_var] = i++;` -- a write to local_array. What line 32
      reads is global_var, the index, which is a different variable and the
      subject of this case's four bug points. Marked `likely` rather than
      `certain` because an alternative reading is that the annotator meant the
      index read and mis-named the variable; under either reading the entry stays
      a trap and the denominator is unchanged.

  - case: svp_simple_022_001
    kind: bug
    index: 2
    reason: access-kind
    confidence: certain
    as_written: "svp_simple_022_001_global_var1 <R, #55>, <W,#66>, <R,#58>"
    corrected: [[read, 55], [write, 66], [write, 58]]
    evidence: >
      Line 58 is `svp_simple_022_001_global_var1 = 0;`, the else branch of
      func_3 -- a plain assignment with no read of the variable.

  - case: svp_simple_022_001
    kind: bug
    index: 3
    reason: access-kind
    confidence: certain
    as_written: "svp_simple_022_001_global_var1 <R, #58>, <W,#66>, <R,#63>"
    corrected: [[write, 58], [write, 66], [read, 63]]
    evidence: >
      Line 58 is a write, as above. Line 63 is
      `global_var3 = global_var1;`, a read of global_var1, and is correct.

  - case: svp_simple_022_001
    kind: trap
    index: 2
    reason: access-kind
    confidence: certain
    as_written: "svp_simple_022_001_global_var1 <R, #55>, <W,#66>, <R,#56>"
    corrected: [[read, 55], [write, 66], [write, 56]]
    evidence: >
      Line 56 is `svp_simple_022_001_global_var1 = 12;`, the then branch of
      func_3 -- a plain assignment.
