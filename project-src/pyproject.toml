[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irqrace"
version = "0.1.0"
description = "Sound detection of data races and atomicity violations in interrupt-driven embedded C, with LLM triage and repair"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=5.4",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=6"]
# Track B. `pydantic` is the only hard requirement -- it defines the verdict
# schema. Provider SDKs are per-backend extras, because the point of the
# backend seam is that no single vendor is mandatory: the OpenAI-compatible
# and Ollama adapters speak plain HTTP from the standard library, so a reviewer
# can run the whole ablation against a local model with nothing extra
# installed. `llm` is the minimum; `llm-anthropic` adds the one adapter that
# uses a vendor SDK.
llm = ["pydantic>=2.0"]
llm-anthropic = ["pydantic>=2.0", "anthropic>=1.0"]

[project.scripts]
irqrace = "irqrace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]

testpaths = ["tests"]
