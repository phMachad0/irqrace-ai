priority_convention: larger-is-higher
subject:
  build:
    mode: single-tu
    cc: clang-14
    linker: llvm-link-14
    flags:
    - -g
    - -O0
    - -Xclang
    - -disable-O0-optnone
    include_dirs: []
    defines: []
    extra_bitcode:
    - common.c
  name: svp_simple_001_001
  source_root: /home/pedro/Documentos/tcc/racebench/2.1_remarks
  sources:
  - svp_simple_001/svp_simple_001_001.c
masking:
  initial_state: all-enabled
  isr_entry_masks_self: false
  primitives:
  - function: disable_isr
    effect: disable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
  - function: enable_isr
    effect: enable
    irq_arg: 0
    all_value: -1
    non_constant_arg: unknown
semantics:
  equal_priority_preemption: true
  isr_arrival: unbounded
  isr_reentrant: false
  nesting: true
  timing_model: unconstrained
externals:
  default: may-read-write-reachable
  models:
  - function: idlerun
    effect: none
    note: 'common.c: an empty spin loop'
  - function: init
    effect: none
    note: 'common.c: calls enable_isr(-1) only'
  - function: rand
    effect: none
    note: libc, no shared state in these subjects
analysis:
  alias: may
  indirect_calls: signature-matched-address-taken
  candidate_classes:
  - race-pair
  - atomicity-triple
  allow_same_statement_a1_a2: true
  solver:
    enabled: true
    timeout_ms: 10000
    on_timeout: inconclusive
output:
  run_root: runs
schema_version: c1/1.0.0
flows:
- id: main
  kind: task
  entry: svp_simple_001_001_main
  irq: null
  priority: 0
  identified_by: config
- id: isr_1
  kind: isr
  entry: svp_simple_001_001_isr_1
  irq: 1
  priority: 1
  identified_by: config
- id: isr_2
  kind: isr
  entry: svp_simple_001_001_isr_2
  irq: 2
  priority: 2
  identified_by: config
ground_truth:
  kind: racebench-remarks
  path: svp_simple_001/svp_simple_001_001.c
